<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/src/shared/styles/reset.css" />
    <link rel="stylesheet" href="/src/pages/contact/contact.css" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo-muneeb-rehman.svg" />

    <script type="module" src="/src/pages/contact/contact.js"></script>

    <meta
      name="description"
      content="Contact Muneeb Rehman for creative development, web and graphic design, and AI-powered projects. Available for freelance work."
      data-i18n-attr="content:contact.description"
    />
    <title data-i18n="contact.title">Contact — Muneeb Rehman</title>
    <meta
      property="og:title"
      content="Contact — Muneeb Rehman"
      data-i18n-attr="content:contact.title"
    />
    <meta
      property="og:description"
      content="Contact Muneeb Rehman for creative development, web and graphic design, and AI-powered projects. Available for freelance work."
      data-i18n-attr="content:contact.description"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/contact/" />
    <meta property="og:image" content="/og/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Muneeb Rehman’s 3D MR logo featuring the titles Creative Developer and Graphic Designer"
      data-i18n-attr="content:home.imageAlt"
    />
  </head>

  <body class="contact-page" data-header-capsule-variant="soft-white">
    <!-------- TRANSITION -------->
    <script>
      if (sessionStorage.getItem("pageTransitionPending") === "true") {
        const storedColor = sessionStorage.getItem("pageTransitionColor")
        const color = storedColor === "dark" ? "dark" : "cream"

        const transition = document.createElement("div")

        transition.classList.add("page-transition", `page-transition--${color}`)

        transition.setAttribute("aria-hidden", "true")
        document.body.prepend(transition)
      }
    </script>

    <!-------- HEADER -------->
    <header class="site-header"></header>

    <main class="contact">
      <div class="contact__frame" aria-hidden="true"></div>
      <canvas class="contact__canvas" aria-hidden="true"></canvas>

      <section class="contact__fallback" aria-labelledby="contact-title">
        <h1 id="contact-title" class="contact__heading">
          <span data-i18n="contact.headingLine1">Let’s create</span>
          <span data-i18n="contact.headingLine2">something worth</span>
          <span data-i18n="contact.headingLine3">remembering</span>
        </h1>

        <div class="contact__availability">
          <p data-i18n="contact.availability">Available for freelance work</p>
          <p data-i18n="contact.availabilityMeta">Based in Pakistan</p>
        </div>

        <div class="contact__services">
          <h2 class="visually-hidden" data-i18n="contact.servicesLabel">Services</h2>
          <ul>
            <li data-i18n="contact.serviceCreativeDevelopment">creative development</li>
            <li data-i18n="contact.serviceImmersiveExperiences">web &amp; graphic design</li>
            <li data-i18n="contact.serviceInteractiveInterfaces">AI &amp; visual content</li>
          </ul>
        </div>

        <a
          class="contact__email"
          href="mailto:muneebrahman500@gmail.com"
          aria-label="Send an email to Muneeb Rehman"
          data-i18n="contact.email"
          data-i18n-attr="aria-label:contact.emailLabel"
        >
          muneebrahman500@gmail.com
        </a>
      </section>
    </main>
  </body>
</html>
